<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Validação local de pintura 3MF</title>
<style>body{background:#131920;color:#dce6ee;font:14px system-ui;padding:32px}button{background:#b3f8e7;color:#15392f;border:0;border-radius:8px;padding:12px;margin-right:8px}pre{white-space:pre-wrap}</style>
<h1>Importação de pintura 3MF</h1><p>Fixture sintética fechada com pintura subdividida, paleta e seleção pelo worker real.</p>
<button id="bambu">Validar Bambu / Orca</button><button id="prusa">Validar Prusa</button><pre id="result" role="status">Aguardando validação.</pre>
<script type="module">
import {parseSceneFile} from '../../src/model-import.js';
import {zipSync,strToU8} from 'three/addons/libs/fflate.module.js';
const worker=new Worker(new URL('../../src/geometry.worker.js',import.meta.url),{type:'module'}),pending=new Map();let id=0;
worker.onmessage=({data})=>{const p=pending.get(data.id);pending.delete(data.id);data.ok?p.resolve(data.payload):p.reject(new Error(data.error));};
function request(type,payload){return new Promise((resolve,reject)=>{const rid=++id;pending.set(rid,{resolve,reject});worker.postMessage({id:rid,type,payload});});}
async function run(kind){
 document.querySelector('#result').textContent='Validando…';
 try{
  const attr=kind==='prusa'?'slic3rpe:mmu_segmentation':'paint_color';
  const model=`<model unit="millimeter" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02" xmlns:slic3rpe="http://schemas.slic3r.org/3mf/2017/06"><resources><object id="1"><mesh><vertices><vertex x="0" y="0" z="0"/><vertex x="20" y="0" z="0"/><vertex x="0" y="20" z="0"/><vertex x="0" y="0" z="20"/></vertices><triangles><triangle v1="0" v2="2" v3="1" ${attr}="481"/><triangle v1="0" v2="1" v3="3"/><triangle v1="1" v2="2" v3="3"/><triangle v1="2" v2="0" v3="3"/></triangles></mesh></object></resources><build><item objectid="1"/></build></model>`;
  const files={'3D/3dmodel.model':strToU8(model),'_rels/.rels':strToU8('<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="r0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" Target="/3D/3dmodel.model"/></Relationships>')};
  if(kind==='prusa')files['Metadata/Slic3r_PE.config']=strToU8('filament_colour = #FA7050;#5070FA\n');
  else files['Metadata/project_settings.config']=strToU8(JSON.stringify({filament_colour:['#FA7050','#5070FA']}));
  const data=parseSceneFile(zipSync(files).buffer,'3mf'),imported=await request('importScene',{data});
  if(!imported.valid||imported.palette.length!==2||imported.indices.length/3!==6)throw new Error('A geometria ou a paleta não passou na verificação.');
  const blue=imported.palette.find(p=>p.filament===2),selected=await request('selectColor',{region:blue.id});
  if(selected.mask.reduce((a,b)=>a+b)!==1)throw new Error('Seleção de cor incorreta.');
  document.querySelector('#result').textContent=`APROVADO · ${kind}\nMalha fechada: sim\nFaces após subdivisão e fechamento de T-junções: 6\nPaleta: ${imported.palette.map(p=>p.name+' '+p.color).join(' / ')}\nFilamento 2 selecionado: 1 subface\nVolume: ${imported.volume.toFixed(3)} mm³`;
 }catch(error){document.querySelector('#result').textContent='FALHOU: '+error.message;}
}
document.querySelector('#bambu').onclick=()=>run('bambu');document.querySelector('#prusa').onclick=()=>run('prusa');
</script></html>
