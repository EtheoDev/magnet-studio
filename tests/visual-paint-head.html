<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Regressão visual — seleção e corte da cabeça</title><style>body{margin:0;background:#18232b;color:#d6e6ed;font:20px system-ui}main{display:flex}section{width:50vw}h3{margin:16px}canvas{width:50vw;height:820px}#status{position:fixed;bottom:0;font-size:13px}</style></head><body><main><section><h3>Seleção na superfície</h3><canvas id="before"></canvas></section><section><h3>Corte pela mesma seleção</h3><canvas id="after"></canvas></section></main><div id="status">Preparando…</div><script type="module">
import * as THREE from 'three';
import {toGeometry} from '../src/geometry.js';
import {selectionSurface} from '../src/selection-surface.js';
import {subsetMesh} from '../src/split-tools.js';
import {smoothSelectionBrush} from '../src/straighten-brush.js';
const worker=new Worker(new URL('../src/geometry.worker.js',import.meta.url),{type:'module'}),pending=new Map();let id=0;
worker.onmessage=({data})=>{const p=pending.get(data.id);pending.delete(data.id);data.ok?p.resolve(data.payload):p.reject(Error(data.error));};
const request=(type,payload={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});worker.postMessage({id:n,type,payload});});
try{
const figure=await request('paintDemo'),head=(await request('selectColor',{region:1})).mask,candidates=[];
for(let f=0;f<head.length;f++)if([0,1,2].some(j=>{const n=figure.indices[f*3+j]*3;return Math.hypot(figure.positions[n],figure.positions[n+1],figure.positions[n+2]-19)<10;}))candidates.push(f);
const change=smoothSelectionBrush(figure,head,null,candidates,[0,0,19],[1,0,0],[0,1,0],10,.5),selectionField=new Float32Array(figure.positions.length/3).fill(NaN);change.vertices.forEach((v,j)=>selectionField[v]=change.levels[j]);
const surface=selectionSurface(figure,head,selectionField),preview=await request('paintInspect',{mask:head,options:{selectionField}}),cut=await request('cutSelection',{mask:head,selectionField,autoDirection:true,direction:[0,0,1]});
function view(canvas){const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(750,820,false);renderer.setPixelRatio(1);renderer.setClearColor('#18232b');const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,750/820,.1,1000);camera.up.set(0,0,1);camera.position.set(55,-120,54);camera.lookAt(0,0,18);scene.add(new THREE.HemisphereLight(0xffffff,0x375373,2.6));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-40,-60,100);scene.add(light);return {renderer,scene,camera};}
function mesh(data,color){return new THREE.Mesh(toGeometry(data),new THREE.MeshStandardMaterial({color,roughness:.55,metalness:.1,side:THREE.DoubleSide}));}
const a=view(document.querySelector('#before')),b=view(document.querySelector('#after'));a.scene.add(mesh(figure,0xa8b9d0));const selected=mesh(subsetMesh(surface.data,surface.mask,true),0x8bdcc3);selected.material.polygonOffset=true;selected.material.polygonOffsetFactor=-1;selected.material.polygonOffsetUnits=-1;a.scene.add(selected);const lineGeo=new THREE.BufferGeometry();lineGeo.setAttribute('position',new THREE.BufferAttribute(preview.smoothedBoundary,3));a.scene.add(new THREE.LineSegments(lineGeo,new THREE.LineBasicMaterial({color:0xffd17c})));
const result=mesh(cut.selected,0x8bdcc3);result.position.fromArray(cut.reference.n).multiplyScalar(10);b.scene.add(result,mesh(cut.remaining,0xa8b9d0));a.renderer.render(a.scene,a.camera);b.renderer.render(b.scene,b.camera);document.querySelector('#status').textContent=JSON.stringify({closure:cut.report.patchClosure,depth:cut.report.patchDepth,components:cut.report.components,path:cut.report.path.status});
}catch(error){document.querySelector('#status').textContent=error.stack;}
</script></body></html>
